<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICM Calculator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2 class="text-center mb-4">ICM and Chip Chop Calculator</h2>

        <!-- Player Input Table -->
        <div class="table-container">
            <table class="table table-bordered text-center" id="playerInputTable">
                <thead class="table-dark">
                    <tr>
                        <th>Name</th>
                        <th>Chip Count</th>
                        <th>Pos.</th>
                        <th>Payout (£)</th>
                    </tr>
                </thead>
                <tbody id="playerTable"></tbody>
                <tfoot class="table-dark">
                    <tr>
                        <td data-label="Totals"><strong>Total:</strong></td>
                        <td data-label="Total Stack" id="totalStack">0</td>
                        <td></td>
                        <td data-label="Total Payout" id="totalPayout">0</td>
                    </tr>
                    <tr class="money-left-row">
                        <td colspan="2" class="money-left-label">
                            <strong>Money Left to Play For:</strong>
                        </td>
                        <td colspan="2" class="money-left-inputs">
                            <div class="money-left-wrapper">
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text money-left-prefix" id="moneyLeftPrefix">£</span>
                                    <input type="number" id="moneyLeftValue" class="form-control" min="0" value="0" step="any">
                                    <select id="moneyLeftMode" class="form-select money-left-mode">
                                        <option value="amount" selected>£</option>
                                        <option value="percent">%</option>
                                    </select>
                                </div>
                                <small id="moneyLeftHelper" class="money-left-helper"></small>
                            </div>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <!-- Action Buttons -->
        <div class="button-container">
            <button class="btn btn-primary" onclick="calculateAll()">CALCULATE</button>
            <button class="btn btn-secondary" id="settingsButton" title="Settings">
                <i class="fas fa-cog"></i>
            </button>
        </div>

        <!-- Settings Panel -->
        <div id="settingsContainer">
            <h4>Settings</h4>

            <div class="mb-3">
                <label for="roundingSelect" class="form-label">Rounding Options:</label>
                <select id="roundingSelect" class="form-select">
                    <option value="0">No Rounding</option>
                    <option value="1" selected>Round to 1</option>
                    <option value="5">Round to 5</option>
                    <option value="10">Round to 10</option>
                    <option value="25">Round to 25</option>
                </select>
            </div>

            <div class="settings-options">
                <label>
                    <input type="checkbox" id="showChipChop" onclick="toggleResults()"> Show Chip-Chop
                </label>
                <label>
                    <input type="checkbox" id="showMixed" onclick="toggleResults()"> Show Mixed Results
                </label>
            </div>

            <div id="sliderContainer" class="mt-3" style="display: none;">
                <label for="icmChipChopSlider" class="form-label">
                    <span id="sliderValue">50</span>% ICM / <span id="chipChopValue">50</span>% Chip-Chop
                </label>
                <input type="range" id="icmChipChopSlider" class="form-range" min="0" max="100" value="50" step="1" oninput="updateSliderLabel()">
            </div>
        </div>

        <!-- Results containers -->
        <div id="icmResultsContainer"></div>
        <div id="chipChopResultsContainer" style="display: none;"></div>
        <div id="mixedResultsContainer" style="display: none;"></div>

        <!-- ICM Distribution (kept hidden by default; no toggle wired yet) -->
        <div id="icmDistributionSection" style="display: none;">
            <h3 class="text-center mt-5">ICM Distribution Table</h3>
            <div class="table-container">
                <table class="table table-bordered text-center">
                    <thead class="table-dark" id="icmHeader"></thead>
                    <tbody id="icmTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Build player input rows -->
    <script>
        (function buildPlayerRows() {
            const tbody = document.getElementById('playerTable');
            let html = '';
            for (let i = 1; i <= 9; i++) {
                html += `
                    <tr>
                        <td data-label="Name"><input type="text" class="form-control player-name" placeholder="Player ${i}"></td>
                        <td data-label="Chip Count"><input type="number" class="form-control stack" min="0" placeholder="0"></td>
                        <td data-label="Position" class="position-cell">${i}</td>
                        <td data-label="Payout (£)"><input type="number" class="form-control payout" min="0" placeholder="0"></td>
                    </tr>
                `;
            }
            tbody.innerHTML = html;
        })();
    </script>

    <script src="script.js"></script>
</body>
</html>
